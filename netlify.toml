# PATCHED (audit fix, high): confirmed via the Netlify dashboard that this
# is the config actually in use (site base directory is "/"). It previously
# pointed the browser directly at the cross-origin Render API with no
# proxy, which silently breaks the SameSite=Lax session cookie on every
# authenticated request. Now proxies /api/* same-origin like the (now
# removed) critmatch_starter/apps/web/netlify.toml did.
[build]
  base = "critmatch_starter/apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Make all client fetches go through Netlify so the session cookie is
  # first-party (avoids third-party cookie blocking).
  NEXT_PUBLIC_API_BASE_URL = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy /api/* to the Render API. status=200 + force=true performs a
# transparent server-side rewrite so the browser sees the request as
# same-origin with Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://critmatch-api-2106.onrender.com/api/:splat"
  status = 200
  force = true