# PATCHED (audit fix, medium - informational only, no behavior change):
# this file and critmatch_starter/apps/web/netlify.toml disagree with each
# other. Confirm which one the live Netlify site actually uses, then remove
# the other to avoid accidental config drift.
[build]
  base = "critmatch_starter/apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_BASE_URL = "https://critmatch-api-2106.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"