services:
  - type: web
    name: critmatch-api
    env: docker
    plan: free
    rootDir: critmatch_starter/apps/api
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_BASE_URL
        value: https://critmatch.netlify.app
      - key: SENTRY_DSN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMART_CLIENT_ID
        sync: false
      - key: SMART_CLIENT_SECRET
        sync: false
      - key: SMART_ISSUER_ALLOWLIST
        sync: false
      - key: SMART_REDIRECT_URI
        sync: false
      - key: FHIR_BASE_URL
        # Default to the SMART Health IT public R4 sandbox; override per env.
        value: https://r4.smarthealthit.org
      - key: EXPORT_SIGNING_KEY
        sync: false
      - key: MRN_HASH_SALT
        sync: false
      - key: DATABASE_URL
        sync: false
      # Dev-only convenience login. Disabled by default; set DEV_LOGIN_ENABLED=1
      # in the Render dashboard to allow it. DEV_LOGIN_ALLOW_PROD=1 is also
      # required because APP_ENV=production above.
      - key: DEV_LOGIN_ENABLED
        sync: false
      - key: DEV_LOGIN_ALLOW_PROD
        sync: false
  - type: worker
    name: critmatch-worker
    env: docker
    plan: free
    rootDir: critmatch_starter
    dockerfilePath: apps/worker/Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: FHIR_BASE_URL
        value: https://r4.smarthealthit.org
      - key: FHIR_ACCESS_TOKEN
        sync: false
      - key: MRN_HASH_SALT
        sync: false
      - key: DATABASE_URL
        sync: false
