[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Make all client fetches go through Netlify so the session cookie is
  # first-party (avoids third-party cookie blocking).
  NEXT_PUBLIC_API_BASE_URL = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy /api/* to the Render API. status=200 + force=true performs a
# transparent server-side rewrite so the browser sees the request as
# same-origin with Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://critmatch-api-2106.onrender.com/api/:splat"
  status = 200
  force = true
