services:
  - type: web
    name: critmatch-api
    env: docker
    plan: standard
    rootDir: critmatch_starter/apps/api
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_BASE_URL
        value: https://critmatch.netlify.app
      - key: SENTRY_DSN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMART_CLIENT_ID
        sync: false
      - key: SMART_CLIENT_SECRET
        sync: false
      - key: SMART_ISSUER_ALLOWLIST
        sync: false
      - key: FHIR_BASE_URL
        sync: false
      - key: EXPORT_SIGNING_KEY
        sync: false
