name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: critmatch_starter/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: critmatch_starter/apps/api/requirements.txt
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          SESSION_SECRET: ci-secret
          EXPORT_SIGNING_KEY: ci-export-key
          APP_ENV: test
          FRONTEND_BASE_URL: http://localhost:3000
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: critmatch_starter/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: critmatch_starter/apps/web/package-lock.json
      - run: npm ci
      # PATCHED (audit fix, high): ensure web lint passes in CI.
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
